[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datalife-analytics"
version = "0.1.0.dev0"
description = "Synthetic data contract, fixture generator, and baselines for DataLife e-Health analytics research."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
]

[project.scripts]
datalife-fixtures = "datalife_analytics.cli:main"
datalife-baseline = "datalife_analytics.baseline.cli:main"
datalife-baseline-diff = "datalife_analytics.baseline.diff_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"datalife_analytics.contracts" = ["*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "invariant: core scientific leakage and determinism invariants",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
