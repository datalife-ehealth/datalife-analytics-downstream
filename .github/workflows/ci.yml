name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Verify repository scaffold
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md CONTRIBUTING.md SECURITY.md SUPPORT.md LICENSE)
          required+=(.editorconfig .gitattributes .gitignore .markdownlint.json)
          required+=(.github/CODEOWNERS .github/pull_request_template.md)
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required file: $path"; exit 1; }
          done

  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip to the audited version
        run: python -m pip install --upgrade pip==26.3

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Ruff and mypy
        run: |
          ruff check .
          ruff format --check .
          mypy src

  test-matrix:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip to the audited version
        run: python -m pip install --upgrade pip==26.3

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Run test suite
        run: pytest

      - name: Generate and validate a fresh dataset
        run: |
          datalife-fixtures generate --seed 1 --subjects 300 --format parquet --out data/generated
          datalife-fixtures validate data/generated

      - name: Leakage-safe baseline on the generated cohort
        run: |
          datalife-baseline --input data/generated --split-seed 7 --out reports/generated
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("reports/generated/metrics.json").read_text("utf-8"))
          assert payload["lineage"]["contract_version"] == "0.1.0"
          assert "naive_prevalence" in payload["models"]
          assert "ridge_logistic" in payload["models"]
          assert payload["limitations"]
          print("baseline report checks passed")
          PY

  research-invariants:
    name: Research invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip to the audited version
        run: python -m pip install --upgrade pip==26.3

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Run leakage and reproducibility invariants
        run: pytest -m invariant -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip to the audited version
        run: python -m pip install --upgrade pip==26.3

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Audit installed dependencies
        run: pip-audit
