name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Verify repository scaffold
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md CONTRIBUTING.md SECURITY.md SUPPORT.md LICENSE)
          required+=(.editorconfig .gitattributes .gitignore .markdownlint.json)
          required+=(.github/CODEOWNERS .github/pull_request_template.md)
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required file: $path"; exit 1; }
          done

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Schema, privacy, and determinism tests
        run: pytest

      - name: Generate and validate a fresh dataset
        run: |
          datalife-fixtures generate --seed 1 --subjects 300 --format parquet --out data/generated
          datalife-fixtures validate data/generated
